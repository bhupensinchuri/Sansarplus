<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SansarPlus | Nepali Christian Lyrics & Worship</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#6366f1', // Indigo 500
              secondary: '#a855f7', // Purple 500
              dark: '#0f172a', // Slate 900 (kept for specific dark overlays)
              card: '#ffffff', // White
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc; /* Slate 50 */
        color: #1e293b; /* Slate 800 */
      }
      /* Custom scrollbar for lyrics */
      .lyrics-scroll::-webkit-scrollbar {
        width: 8px;
      }
      .lyrics-scroll::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.05);
      }
      .lyrics-scroll::-webkit-scrollbar-thumb {
        background: rgba(0,0,0,0.2);
        border-radius: 4px;
      }
      .lyrics-scroll::-webkit-scrollbar-thumb:hover {
        background: rgba(0,0,0,0.3);
      }
      
      /* Hide scrollbar for horizontal sliders (Netflix style) */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }

      /* Print Styles */
      @media print {
        @page { margin: 2cm; }
        body { background: white; color: black; }
        nav, footer, .no-print, .fixed { display: none !important; }
        
        /* Reset containers for print */
        #sansarplus-app, .min-h-screen, .max-w-6xl, .max-w-7xl { 
            width: 100% !important; 
            margin: 0 !important; 
            padding: 0 !important;
            max-width: none !important;
            min-height: auto !important;
        }

        /* Ensure text is black and readable */
        p, h1, h2, h3, h4, span, div { 
            color: black !important; 
            text-shadow: none !important; 
        }

        /* Adjust grid layout for print to be linear */
        .grid { display: block !important; }
        .lg\:col-span-8, .lg\:col-span-4 { width: 100% !important; margin-bottom: 20px; }
        
        /* Hide sidebar navigation links specifically */
        .print-hidden { display: none !important; }
        
        /* Remove borders and shadows */
        .border, .shadow-sm, .shadow-md { 
            border: none !important; 
            box-shadow: none !important; 
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6"
  }
}
</script>
</head>
  <body>
    <div id="sansarplus-app"></div>
  </body>
</html>
